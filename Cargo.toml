[workspace]
members = ["atp-core", "atp-cli", "atp-tui", "atp-gui", "atp-wasm", "atp-lsp"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Nervosys"]
license = "AGPL-3.0-only"
description = "Agentic Text Processor — an agentic-first successor to grep, sed, and awk"
repository = "https://github.com/nervosys/AgenticTextProcessor"
homepage = "https://github.com/nervosys/AgenticTextProcessor"
documentation = "https://docs.rs/atp-core"
readme = "README.md"
keywords = ["text-processing", "grep", "sed", "awk", "agentic"]
categories = ["command-line-utilities", "text-processing", "development-tools"]
rust-version = "1.75.0"

[workspace.dependencies]
aho-corasick = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
walkdir = "2"
ignore = "0.4"
globset = "0.4"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "string"] }
colored = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rustyline = "15"
notify = { version = "8", features = ["macos_fsevent"] }
toml = "0.8"
rayon = "1"
memmap2 = "0.9"
dirs = "6"
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
async-trait = "0.1"
